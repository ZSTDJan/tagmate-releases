{
  "name": "Temporary TagMate model backup copy",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "tagmate-model-backup-copy-20261102",
    "cancel-in-progress": false
  },
  "jobs": {
    "copy": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Copy only the 12 signed-manifest model resources into verified draft",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "PYTHONUNBUFFERED": "1"
          },
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport concurrent.futures, hashlib, json, pathlib, subprocess, tempfile\nREPO = \"ZSTDJan/tagmate-releases\"\nRELEASE_ID = 431022714\nTAG = \"tagmate-model-backup-20261102\"\nFILES = [{'name': 'tagmate-components-clip-model-CLIP_--_----.md', 'size': 13919, 'sha256': 'f02a74f46153a2f14a23c902194489778c0882ef38bbb23c38dc81fbfc5f5c04'}, {'name': 'tagmate-components-clip-model-config.json', 'size': 4519, 'sha256': '8a09b467700c58138c29d53c605b34ebc69beaadd13274a8a2af8ad2c2f4032a'}, {'name': 'tagmate-components-clip-model-merges.txt', 'size': 524619, 'sha256': '9fd691f7c8039210e0fced15865466c65820d09b63988b0174bfe25de299051a'}, {'name': 'tagmate-components-clip-model-model.safetensors', 'size': 1710540580, 'sha256': 'a2bf730a0c7debf160f7a6b50b3aaf3703e7e88ac73de7a314903141db026dcb'}, {'name': 'tagmate-components-clip-model-preprocessor_config.json', 'size': 316, 'sha256': '910e70b3956ac9879ebc90b22fb3bc8a75b6a0677814500101a4c072bd7857bd'}, {'name': 'tagmate-components-clip-model-special_tokens_map.json', 'size': 389, 'sha256': 'f8c0d6c39aee3f8431078ef6646567b0aba7f2246e9c54b8b99d55c22b707cbf'}, {'name': 'tagmate-components-clip-model-tokenizer.json', 'size': 2224003, 'sha256': 'a83e0809aa4c3af7208b2df632a7a69668c6d48775b3c3fe4e1b1199d1f8b8f4'}, {'name': 'tagmate-components-clip-model-tokenizer_config.json', 'size': 905, 'sha256': 'deef455e52fa5e8151e339add0582e4235f066009601360999d3a9cda83b1129'}, {'name': 'tagmate-components-clip-model-vocab.json', 'size': 961143, 'sha256': '3f0c4f7d2086b61b38487075278ea9ed04edb53a03cbb045b86c27190fa8fb69'}, {'name': 'tagmate-components-dinov2-model-config.json', 'size': 549, 'sha256': '12df51c069a2dc1305e34ba71ef58bc2407ea553b75f4722a1715c1bce3bbed0'}, {'name': 'tagmate-components-dinov2-model-model.safetensors', 'size': 1217522888, 'sha256': '399fba97a95f22c36834418bc69373364a99af3a1153da1c0fb31db567c92e23'}, {'name': 'tagmate-components-dinov2-model-preprocessor_config.json', 'size': 436, 'sha256': '14e780d86fa1861f8751f868d7f45425b5feb55c38ca26f152ca5097ab30f828'}]\ndef gh(*args):\n p=subprocess.run([\"gh\",*args],text=True,capture_output=True,check=True)\n return p.stdout\ndef release():\n r=json.loads(gh(\"api\",f\"repos/{REPO}/releases/{RELEASE_ID}\"))\n assert r[\"draft\"] and r[\"tag_name\"]==TAG\n return r\ndef copy(f):\n r=release(); found=[a for a in r[\"assets\"] if a[\"name\"]==f[\"name\"]]\n if found:\n  a=found[0];assert a[\"size\"]==f[\"size\"] and a[\"digest\"]==\"sha256:\"+f[\"sha256\"]\n  print(\"Already verified\", f[\"name\"],flush=True);return\n with tempfile.TemporaryDirectory(prefix=\"tagmate-model-\") as temp:\n  p=pathlib.Path(temp)/f[\"name\"]\n  url=\"https://pub-d1808de916864ed59b6df6d462946673.r2.dev/tagmate-2026.08.24.1/\"+f[\"name\"]\n  subprocess.run([\"curl\",\"--fail\",\"--silent\",\"--show-error\",\"--location\",\"--retry\",\"1\",\"--max-time\",\"900\",\"--output\",str(p),url],check=True)\n  assert p.stat().st_size==f[\"size\"]\n  with p.open(\"rb\") as stream:digest=hashlib.file_digest(stream,\"sha256\").hexdigest()\n  assert digest==f[\"sha256\"]\n  release()\n  gh(\"release\",\"upload\",TAG,\"--repo\",REPO,str(p))\n  a=next(a for a in release()[\"assets\"] if a[\"name\"]==f[\"name\"])\n  assert a[\"size\"]==f[\"size\"] and a[\"digest\"]==\"sha256:\"+f[\"sha256\"]\n  print(\"Uploaded and verified\",f[\"name\"],flush=True)\nwith concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:list(pool.map(copy,FILES))\nr=release()\nassert sorted((a[\"name\"],a[\"size\"],a[\"digest\"]) for a in r[\"assets\"])==sorted((f[\"name\"],f[\"size\"],\"sha256:\"+f[\"sha256\"]) for f in FILES)\nprint(\"CANDIDATE_ALL_12_VERIFIED\")\nPY\n"
        }
      ]
    }
  }
}
