          tagmate-components-preset-role-01-preset-role-01-2026.08.08.183317.7z	2728787	fb46d50da6752c68a9769ad71be01168109752eddd6f0b2bba7c342d0bd85865
          tagmate-components-python-runtime-cpu-python-runtime-cpu-2.7.1-cpu.7z	228304582	1886d188395bcf7f22ed7c50676496895db7057bd809e4f24aae0ca6bd5a0622
          tagmate-components-python-runtime-gpu-python-runtime-gpu-2.7.1-cu128.7z	2100537061	4b23614530d67d6afb07d3c168be4bebfe87f2b67332aada9787c8c3fd2a7101
          ASSETS

          while IFS=$'\t' read -r name expected_size expected_sha; do
            remote_line="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq ".assets[] | select(.name == \"$name\") | [.size, .digest] | @tsv")"
            if [[ -n "$remote_line" ]]; then
              IFS=$'\t' read -r remote_size remote_digest <<< "$remote_line"
              if [[ "$remote_size" != "$expected_size" || "$remote_digest" != "sha256:$expected_sha" ]]; then
                echo "Existing asset mismatch: $name" >&2
                exit 1
              fi
              echo "Already verified: $name"
              continue
            fi

            file="$work/$name"
            rm -f "$file"
            curl --fail --location --show-error --silent --retry 10 --retry-all-errors --continue-at - --output "$file" "$R2_BASE_URL/$name"
            actual_size="$(stat -c '%s' "$file")"
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"
            if [[ "$actual_size" != "$expected_size" || "$actual_sha" != "$expected_sha" ]]; then
              echo "Downloaded asset mismatch: $name size=$actual_size sha256=$actual_sha" >&2
              exit 1
            fi

            gh release upload "$RELEASE_TAG" "$file" --repo "$GH_REPO"
            rm -f "$file"

            verified=false
            for check in $(seq 1 30); do
              remote_line="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq ".assets[] | select(.name == \"$name\") | [.size, .digest] | @tsv")"
              if [[ "$remote_line" == "$expected_size"$'\t'"sha256:$expected_sha" ]]; then
                verified=true
                break
              fi
              sleep 5
            done
            if [[ "$verified" != true ]]; then
              echo "Remote verification failed: $name" >&2
              exit 1
            fi
            echo "Uploaded and verified: $name"
          done < "$work/assets.tsv"

          final="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,assets --jq '[.isDraft, (.assets | length)] | @tsv')"
          if [[ "$final" != true$'\t'23 ]]; then
            echo "Draft state or asset count mismatch: $final" >&2
            exit 1
          fi
          echo "Draft contains 23 verified assets."
