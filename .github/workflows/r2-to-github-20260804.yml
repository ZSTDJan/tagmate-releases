name: One-time R2 to GitHub release transfer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tagmate-release-transfer-2026-08-04
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download, verify, and upload missing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: tagmate-2026.08.04.225442
          R2_BASE_URL: https://pub-d1808de916864ed59b6df6d462946673.r2.dev
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tagmate-r2-transfer"
          mkdir -p "$work"

          cat > "$work/assets.tsv" <<'ASSETS'
          tagmate-installer-core-1.bin	1889600768	19ea512b575dbdd2f1ebfe371d316ebeb1c3b5eb3a31d6d17785f6d439ead5cc
          tagmate-installer-core-2.bin	1900000000	ea07708a64c83a01d364dbe821978a5dcd10b076fda811496109e53e57c140e7
          tagmate-installer-core-3.bin	1900000000	6cbdd2c131acc488fd9d67555020835e69ec95bca38572b37b675bf4c096f87f
          ASSETS

          while IFS=$'\t' read -r name expected_size expected_sha; do
            remote_line="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq ".assets[] | select(.name == \"$name\") | [.size, .digest] | @tsv")"
            if [[ -n "$remote_line" ]]; then
              IFS=$'\t' read -r remote_size remote_digest <<< "$remote_line"
              if [[ "$remote_size" != "$expected_size" || "$remote_digest" != "sha256:$expected_sha" ]]; then
                echo "Existing asset mismatch: $name" >&2
                exit 1
              fi
              echo "Already verified: $name"
              continue
            fi

            path="$work/$name"
            rm -f "$path"
            downloaded=false
            for attempt in $(seq 1 10); do
              if curl --fail --location --show-error --silent --continue-at - --output "$path" "$R2_BASE_URL/$name"; then
                downloaded=true
                break
              fi
              echo "Download retry $attempt/10: $name" >&2
              sleep $((attempt * 5))
            done
            if [[ "$downloaded" != true ]]; then
              echo "Download failed: $name" >&2
              exit 1
            fi

            actual_size="$(stat -c '%s' "$path")"
            actual_sha="$(sha256sum "$path" | awk '{print $1}')"
            if [[ "$actual_size" != "$expected_size" || "$actual_sha" != "$expected_sha" ]]; then
              echo "Downloaded asset mismatch: $name size=$actual_size sha256=$actual_sha" >&2
              exit 1
            fi

            gh release upload "$RELEASE_TAG" "$path" --repo "$GH_REPO"
            rm -f "$path"

            verified=false
            for check in $(seq 1 30); do
              remote_line="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq ".assets[] | select(.name == \"$name\") | [.size, .digest] | @tsv")"
              if [[ "$remote_line" == "$expected_size"$'\t'"sha256:$expected_sha" ]]; then
                verified=true
                break
              fi
              sleep 5
            done
            if [[ "$verified" != true ]]; then
              echo "Remote verification failed: $name" >&2
              exit 1
            fi
            echo "Uploaded and verified: $name"
          done < "$work/assets.tsv"

          final="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,assets --jq '[.isDraft, (.assets | length)] | @tsv')"
          if [[ "$final" != true$'\t'8 ]]; then
            echo "Draft state or asset count mismatch: $final" >&2
            exit 1
          fi
          echo "Draft contains 8 verified assets."