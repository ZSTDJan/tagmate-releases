name: One-time R2 to GitHub release transfer 20260824

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tagmate-release-transfer-2026-08-24-1
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download verify and upload missing asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: tagmate-2026.08.24.1
          R2_BASE_URL: https://pub-d1808de916864ed59b6df6d462946673.r2.dev/tagmate-2026.08.24.1
          ASSET_NAME: tagmate-components-python-runtime-gpu-python-runtime-gpu-2.7.1-cu128.7z
          EXPECTED_SIZE: "2100536667"
          EXPECTED_SHA256: ed6976cd6b95c23cfc2e6d9a18f0a749e6a3c76194d9ba401859a7406bfcef09
        run: |
          set -euo pipefail
          state="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,assets)"
          test "$(jq -r '.isDraft' <<< "$state")" = "true"
          remote_line="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | [.size, .digest] | @tsv' <<< "$state")"
          expected_line="$EXPECTED_SIZE"$'\t'"sha256:$EXPECTED_SHA256"
          if [[ -n "$remote_line" ]]; then
            test "$remote_line" = "$expected_line"
          else
            file="$RUNNER_TEMP/$ASSET_NAME"
            curl --fail --location --show-error --silent --retry 10 --retry-all-errors --continue-at - --output "$file" "$R2_BASE_URL/$ASSET_NAME"
            test "$(stat -c '%s' "$file")" = "$EXPECTED_SIZE"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$EXPECTED_SHA256"
            gh release upload "$RELEASE_TAG" "$file" --repo "$GH_REPO"
          fi
          verified=false
          for check in $(seq 1 60); do
            final="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,assets)"
            is_draft="$(jq -r '.isDraft' <<< "$final")"
            asset_count="$(jq '.assets | length' <<< "$final")"
            final_line="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | [.size, .digest] | @tsv' <<< "$final")"
            if [[ "$is_draft" = "true" && "$asset_count" = "24" && "$final_line" = "$expected_line" ]]; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = "true"
          echo "Draft contains 24 verified assets"